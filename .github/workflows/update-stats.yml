name: Update GitHub Stats

on:
  schedule:
    # Runs every hour at XX:24:27 IST (UTC 54th minute + 27s sleep due to +05:30 offset)
    - cron: '54 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Update Stats
        run: |
          sleep 27
          python .github/scripts/update_stats.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg README.md
          if git diff --staged --quiet; then
            echo "No stats changed."
          else
            git commit -m "Auto-update GitHub stats [skip ci]"
            git push
          fi
